# The token status list. See deploy/README.md.
#
# Use deploy.sh or the Deploy workflow, not compose directly.
#
# proxy-net belongs to eudi-srv-wallet-provider and must be up first.

name: eudiw-statuslist

services:
  statuslist:
    image: ${STATUSLIST_IMAGE:?set by the deploy workflow}
    container_name: eudiw-statuslist
    restart: unless-stopped
    expose:
      - "5603"
    environment:
      # Not routed by the proxy itself any more: `web` below fronts it, so it
      # has no VIRTUAL_HOST and is not on proxy-net.

      # Signed into every token as `sub`, so it cannot be rewritten later and
      # does not migrate anything already issued. No port: behind the proxy the
      # name arrives on 443.
      SERVICE_URL: ${SERVICE_URL:?set in stack.env}

      API_key: ${STATUSLIST_API_KEY:?repository secret, see deploy/README.md}

      STATUS_LISTS_DIR: /data/status_lists
      STATUS_LIST_BACKUP_DIR: /data/status_list_backup
      FC_PRIVATE_KEY: /keys/signing.key
      FC_CERTIFICATE: /keys/signing.der
    volumes:
      - status-lists:/data/status_lists
      - status-list-backup:/data/status_list_backup
      # The signing key is placed on the box once, out of band, and never passes
      # through a CI runner. Read-only. See deploy/README.md.
      - ${SIGNING_KEY_DIR:?set in stack.env}:/keys:ro
    healthcheck:
      # Needs no API key and no arguments, so it answers whether or not any list
      # has been issued. Trailing slash matters: without it Flask replies 308 and
      # curl -f treats the redirect as a failure.
      test: ["CMD", "curl", "-fsS", "http://localhost:5603/token_status_list/swagger/", "-o", "/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - statuslist

  # Fronts the app on the two prefixes it publishes under, and serves the lists.
  #
  # The app writes every list it issues to disk as signed .jwt and .cwt files,
  # and signs their URL into credentials, but has no route that serves them:
  # upstream expects a web server in front. Until 2026-09-24 there was none here,
  # and every published list URI was a 404. Also frees the hostname root, which
  # the app held but never used.
  #
  # Only these two prefixes, unchanged: SERVICE_URL and every URL already signed
  # into a credential stay valid.
  web:
    image: nginx:1.29.1-alpine
    container_name: eudiw-statuslist-web
    restart: unless-stopped
    depends_on:
      - statuslist
    expose:
      - "80"
    environment:
      # Two paths on one container. No prefix stripping: dest equals the path.
      VIRTUAL_HOST_MULTIPORTS: |-
        ${STATUSLIST_HOST:?set in stack.env}:
          "/token_status_list":
            port: 80
            dest: "/token_status_list"
          "/identifier_list":
            port: 80
            dest: "/identifier_list"
      LETSENCRYPT_HOST: ${STATUSLIST_HOST}
      LETSENCRYPT_EMAIL: ${LETSENCRYPT_EMAIL:?set in stack.env}
    volumes:
      # Read-only: the app is the only writer.
      - status-lists:/data/status_lists:ro
    configs:
      - source: web-nginx
        target: /etc/nginx/conf.d/default.conf
    networks:
      - proxy-net
      - statuslist

configs:
  # Published lists are /<kind>/<country>/<doctype>/<uuid>, per
  # app/list_management.py, and live on disk under that path as
  # <kind>.jwt and <kind>.cwt. The Accept header picks the format, JWT unless
  # CWT is asked for, with the media types the tokens themselves declare.
  # full_list.json sits beside them and is the app's unsigned working state:
  # never served.
  #
  # Anything else under /token_status_list is the app's API and swagger UI.
  # Its upstream is looked up per request, so a restarted app is found again
  # rather than cached at a stale address.
  web-nginx:
    content: |
      map $$http_accept $$list_fmt {
          default  jwt;
          ~*\+cwt  cwt;
      }

      server {
          listen 80;

          # Quoted: nginx needs it for a regex containing braces.
          location ~ "^/token_status_list/([^/]+)/([^/]+)/([0-9a-f-]{36})$$" {
              # Resolve the format first. The map's regex, once it matches, clobbers
              # $$1..$$3, so evaluating it inside the rewrite empties the path.
              set $$fmt $$list_fmt;
              rewrite "^/token_status_list/([^/]+)/([^/]+)/([0-9a-f-]{36})$$" /_tsl/$$1/$$2/$$3/token_status_list.$$fmt last;
          }
          # Quoted: nginx needs it for a regex containing braces.
          location ~ "^/identifier_list/([^/]+)/([^/]+)/([0-9a-f-]{36})$$" {
              # Resolve the format first. The map's regex, once it matches, clobbers
              # $$1..$$3, so evaluating it inside the rewrite empties the path.
              set $$fmt $$list_fmt;
              rewrite "^/identifier_list/([^/]+)/([^/]+)/([0-9a-f-]{36})$$" /_idl/$$1/$$2/$$3/identifier_list.$$fmt last;
          }

          location /_tsl/ {
              internal;
              alias /data/status_lists/token_status_list/;
              types {
                  application/statuslist+jwt jwt;
                  application/statuslist+cwt cwt;
              }
              add_header Vary Accept always;
              add_header Cache-Control no-cache always;
          }
          location /_idl/ {
              internal;
              alias /data/status_lists/identifier_list/;
              types {
                  application/identifierlist+jwt jwt;
                  application/identifierlist+cwt cwt;
              }
              add_header Vary Accept always;
              add_header Cache-Control no-cache always;
          }

          location /token_status_list {
              resolver 127.0.0.11 valid=10s;
              set $$app http://statuslist:5603;
              proxy_pass $$app;
              proxy_set_header Host $$host;
              proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $$http_x_forwarded_proto;
          }

          location / {
              return 404;
          }
      }

volumes:
  # Every status list ever issued. Named, not a bind mount: a relative bind
  # mount resolves on the remote filesystem under DOCKER_HOST=ssh://.
  status-lists:
  status-list-backup:

networks:
  # Created by eudi-srv-wallet-provider's deploy stack.
  proxy-net:
    external: true
    name: proxy-net
  # Private: web to the app.
  statuslist:
    name: eudiw-statuslist
