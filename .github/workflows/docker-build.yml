# Build the container image and push it to GHCR.
#
# Build only. Deployment is a separate, manually triggered workflow, so a push
# never changes what is running on a server.
#
# Images land at ghcr.io/grnet/eudi-srv-statuslist-py, tagged by branch, by
# commit SHA, and as `latest` on the default branch. The SHA tag is the one
# worth deploying: it names exactly one build.

name: Docker build

on:
  push:
    branches:
      - main
      - 'feat/**'
    paths-ignore:
      - '**.md'
      - '.gitignore'
  pull_request:
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3.10.0

      # Pull requests from forks cannot read secrets, and pushing an image from
      # unreviewed code is not something to do by default. Those builds run to
      # prove the Dockerfile still works, and stop short of publishing.
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3.4.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5.7.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.description=Token status list service for the EUDI wallet (GRNET fork). Containerised for local development and deployment; see DOCKER.md.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0

      - name: Build and push
        uses: docker/build-push-action@v6.15.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      # The image is only useful if it starts and can issue. The service needs
      # signing material, which is deliberately not in the repo, so the test
      # mints a throwaway EC key and exercises the full path: allocate an index,
      # then read it back. A container that starts but cannot sign would
      # otherwise pass unnoticed.
      - name: Smoke test the image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          IMAGE=$(printf '%s' "${{ steps.meta.outputs.tags }}" | head -1)
          echo "Testing $IMAGE"

          mkdir -p /tmp/keys
          openssl ecparam -genkey -name prime256v1 -noout -out /tmp/keys/signing.key
          openssl req -new -x509 -key /tmp/keys/signing.key -out /tmp/keys/signing.crt \
            -days 1 -subj "/CN=smoke-test-ds"
          openssl x509 -in /tmp/keys/signing.crt -outform der -out /tmp/keys/signing.der
          chmod 644 /tmp/keys/*

          docker run -d --name smoke -p 5603:5603 \
            -e SERVICE_URL="http://localhost:5603/" \
            -e API_key=smoke \
            -e FC_PRIVATE_KEY=/keys/signing.key \
            -e FC_CERTIFICATE=/keys/signing.der \
            -v /tmp/keys:/keys:ro \
            "$IMAGE"

          for i in $(seq 1 30); do
            if curl -fsS "http://localhost:5603/token_status_list/swagger/" -o /dev/null 2>/dev/null; then
              echo "Service answered after ${i}s"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "::error::the service did not answer within 30s"
              docker logs smoke
              docker rm -f smoke >/dev/null
              exit 1
            fi
            sleep 1
          done

          # Allocate an index. Form-encoded, not JSON: the endpoint reads
          # request.form, and all three fields are required.
          RESP=$(curl -fsS -X POST "http://localhost:5603/token_status_list/take" \
            -H "X-Api-Key: smoke" \
            -F "country=FC" \
            -F "doctype=oauth-client-attestation+jwt" \
            -F "expiry_date=2030-01-01")
          echo "take: $RESP"

          URI=$(printf '%s' "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status_list"]["uri"])')
          IDX=$(printf '%s' "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status_list"]["idx"])')

          # Read it back. A freshly allocated index is 0, meaning valid.
          VALUE=$(curl -fsS -G "http://localhost:5603/token_status_list/get" \
            --data-urlencode "uri=$URI" --data-urlencode "idx=$IDX")
          echo "get idx $IDX: $VALUE"

          if [ "$VALUE" != "0" ]; then
            echo "::error::expected a freshly allocated index to read back as 0, got '$VALUE'"
            docker logs smoke
            docker rm -f smoke >/dev/null
            exit 1
          fi

          # An unauthenticated write must be refused.
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            "http://localhost:5603/token_status_list/take" \
            -H "X-Api-Key: wrong" \
            -F "country=FC" -F "doctype=oauth-client-attestation+jwt" -F "expiry_date=2030-01-01")
          if [ "$CODE" != "401" ]; then
            echo "::error::expected 401 for a bad API key, got $CODE"
            docker rm -f smoke >/dev/null
            exit 1
          fi

          echo "Issued, read back, and rejected a bad key."
          docker rm -f smoke >/dev/null
